name: Release

# When main's package.json has a version npm doesn't: each platform's addon
# built on that platform, tested, and published beside the package that
# loads it, then the commit tagged. Publishing needs an NPM_TOKEN secret;
# without one the packages are left as an artifact. Dispatched by hand, it
# retries a release that failed, or stops at that artifact for a version
# npm has.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # empty when npm hasn't it: npm view then fails with E404
          [ -n "$(npm view "netcode-io@$version" version 2>/dev/null)" ] || echo "new=true" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.pkg }}
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # AES-NI and PCLMUL aren't in x86-64-v3: without them TLS and QUIC
          # fall back to software crypto, ~35x slower
          - { os: ubuntu-latest, pkg: linux-x64, target: x86_64-linux-gnu.2.28, cpu: x86_64_v3+aes+pclmul }
          - { os: ubuntu-24.04-arm, pkg: linux-arm64, target: aarch64-linux-gnu.2.28, cpu: generic+aes+sha2 }
          - { os: macos-latest, pkg: darwin-arm64, target: aarch64-macos.13.0, cpu: apple_m1 }
          - { os: windows-latest, pkg: win32-x64, target: x86_64-windows-gnu, cpu: x86_64_v3+aes+pclmul }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: netcode-io

      - uses: actions/checkout@v4
        with:
          repository: endel/quic-zig
          path: quic-zig

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: netcode-io
        run: zig build -Doptimize=ReleaseFast -Dstrip -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }}

      # the tests load zig-out's addon: the binary that ships
      # script-shell: npm's default on Windows, cmd, can't set a variable inline
      - name: Test
        working-directory: netcode-io
        run: npm test --script-shell=bash

      - name: Record the quic-zig it was built from
        run: git -C quic-zig rev-parse HEAD > netcode-io/zig-out/lib/quic-zig.rev

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: |
            netcode-io/zig-out/lib/netcode_io.node
            netcode-io/zig-out/lib/quic-zig.rev
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.new == 'true' && github.ref == 'refs/heads/main' && secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage the platform packages
        run: node scripts/stage.mjs artifacts dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist

      # Platform packages first: the main one depends on them. What npm has
      # is skipped, as a version can't be published twice: a run that failed
      # partway can go again.
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          for d in dist/*/ .; do
            name=$(node -p "require('./$d/package.json').name")
            [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ] || npm publish "$d" --access public
          done

      - name: Tag the commit
        if: env.PUBLISH == 'true'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

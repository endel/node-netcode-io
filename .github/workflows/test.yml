name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        node: [22]
        # engines says >=18: every Node line still on the x64 runner
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: netcode-io

      # build.zig.zon takes quic-zig from ../quic-zig
      - uses: actions/checkout@v4
        with:
          repository: endel/quic-zig
          path: quic-zig

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        working-directory: netcode-io
        run: zig build -Doptimize=ReleaseFast

      # Zig's wire tests, then node --test once for each websocket.thread
      - name: Test
        working-directory: netcode-io
        run: npm test

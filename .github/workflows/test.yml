name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [22]
        # the later Node lines engines admits, on the x64 runner
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: netcode-io

      # build.zig.zon takes quic-zig from ../quic-zig
      - uses: actions/checkout@v4
        with:
          repository: endel/quic-zig
          path: quic-zig

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        working-directory: netcode-io
        run: zig build -Doptimize=ReleaseFast

      # Zig's wire tests, then node --test once for each websocket.thread.
      # script-shell: npm's default on Windows, cmd, can't set a variable inline
      - name: Test
        working-directory: netcode-io
        run: npm test --script-shell=bash
